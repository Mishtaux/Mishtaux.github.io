<style>
  :root{
    --paper:#EDEAE0;
    --card:#FAF8F2;
    --card-2:#F2EEE2;
    --ink:#1B1A17;
    --ink-soft:#4A473E;
    --muted:#8C8575;
    --line:#D9D3C1;
    --blue:#2E4BD6;
    --blue-soft:#E4E8FB;
    --orange:#E85427;
    --orange-soft:#FCE7DE;
    --magenta:#C22E82;
    --magenta-soft:#F8DEEE;
    --green:#2F7A4F;
    --green-soft:#DDEEE2;
    --teal:#1B7A72;
    --teal-soft:#DCEEEC;
    --mustard:#A9781A;
    --mustard-soft:#F1E6CE;
    --shadow: 4px 4px 0 rgba(27,26,23,0.08);
    --radius: 3px;
  }
  [data-theme="dark"]{
    --paper:#181713;
    --card:#211F1A;
    --card-2:#28251F;
    --ink:#F3F0E6;
    --ink-soft:#D3CDBC;
    --muted:#8F8975;
    --line:#3A362C;
    --blue:#7C8FEF;
    --blue-soft:#232A4A;
    --orange:#FF8A5C;
    --orange-soft:#3E2519;
    --magenta:#EF7CC0;
    --magenta-soft:#3E2233;
    --green:#7FC79A;
    --green-soft:#20332A;
    --teal:#5FC2B8;
    --teal-soft:#1B302D;
    --mustard:#D9AD4F;
    --mustard-soft:#332A16;
    --shadow: 4px 4px 0 rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4,.display{
    font-family:'Space Grotesk', sans-serif;
    letter-spacing:-0.01em;
    margin:0;
  }

/* ===================== STORAGE LAYER ===================== */
/* Small async-shaped store so this can be swapped for a real backend
   later without touching any app logic. Backed by localStorage for now. */
const Store = {
  async get(key){
    try{
      const raw = window.localStorage.getItem(key);
      return raw === null ? null : raw;
    }catch(e){ return null; }
  },
  async set(key, value){
    try{ window.localStorage.setItem(key, value); return true; }
    catch(e){ return false; }
  }
};

/* ===================== CONCRETE MISSION BUILDER ===================== */

function ladderConstraints(archetype, level){
  const list = archetype.baseConstraints.slice();
  if(archetype.ladder && level>1){
    const ladder = LADDERS[archetype.ladder];
    for(let l=2;l<=level;l++){
      const c = ladder[l];
      if(c && !list.includes(c)) list.push(c);
    }
  }
  return list;
}

function buildConcreteMission(archetypeId, variantIndex, level){
  const a = ARCH_BY_ID[archetypeId];
  const v = a.variants[variantIndex % a.variants.length];
  level = level || 1;
  const diff = Math.min(5, a.diff + (level-1));
  const timeScale = 1 + (level-1)*0.15;
  return {
    archetypeId, variantIndex, level,
    fingerprint: `${archetypeId}:${variantIndex}:${level}`,
    varFingerprint: `${archetypeId}:${variantIndex}`,
    cat: a.family === "project" ? "pd" : a.family,
    taskType: a.taskType,
    skills: [a.primary, ...a.secondary],
    primarySkillName: (SKILL_DEFS.find(s=>s[0]===a.primary)||[,a.primary])[1],
    diff, time: Math.round(a.time*timeScale), minTime: a.minTime,
    title: a.titleFn(v),
    goal: a.goal,
    scenario: a.scenarioFn(v),
    deliverable: a.deliverable,
    constraints: ladderConstraints(a, level),
    direction: a.direction,
    process: a.process,
    references: a.references,
    approaches: a.approaches,
    focus: a.focus,
    extraChallenge: a.extraChallenge,
    reflection: a.reflection,
    minDesc: `A smaller version of the same brief: ${a.deliverable} Spend far less time on polish — aim to just complete one honest pass.`
  };
}

function currentMilestone(project){
  return project.milestones.find(m=>m.percent<100) || project.milestones[project.milestones.length-1];
}

function applyProjectProgress(projectId, milestoneId){
  const p = S.projects.find(x=>x.id===projectId);
  if(!p) return;
  const m = p.milestones.find(x=>x.id===milestoneId) || currentMilestone(p);
  if(!m) return;
  m.percent = Math.min(100, m.percent + 34);
  if(p.milestones.every(x=>x.percent>=100)) p.completedDate = todayStr();
  saveState();
}

function scaleProcessForMinutes(minutes){
  if(minutes<=20) return [["Quick thumbnail sketches",Math.round(minutes*0.6)],["Pick the strongest direction",minutes-Math.round(minutes*0.6)]];
  if(minutes<=45){
    const a=Math.round(minutes*0.15), b=Math.round(minutes*0.65);
    return [["Gather references / warm up",a],["Develop one direction",b],["Note next step for tomorrow",minutes-a-b]];
  }
  if(minutes<=70){
    const a=5,b=Math.round(minutes*0.6),c=Math.round(minutes*0.2);
    return [["Review where the project stands",a],["Develop the current milestone",b],["Compare against the project brief",c],["Note next step",minutes-a-b-c]];
  }
  const a=10,b=Math.round(minutes*0.4),c=Math.round(minutes*0.35),d=Math.round(minutes*0.15);
  return [["Review project + milestone goal",a],["Develop 2-3 directions",b],["Refine the strongest",c],["Compare against brief + decide",d],["Note next step",minutes-a-b-c-d]];
}

function buildProjectMission(project, timeKey){
  const bucket = TIME_BUCKETS.find(b=>b.key===timeKey) || TIME_BUCKETS[2];
  const milestone = currentMilestone(project);
  const minutes = bucket.minutes;
  return {
    archetypeId: "project:"+project.templateId, variantIndex:0, level:1,
    fingerprint: "project:"+project.id+":"+milestone.id+":"+Date.now(),
    varFingerprint: "project:"+project.id+":"+milestone.id,
    cat: "pd", taskType: "project",
    skills: project.skills, diff: 3, time: minutes, minTime: Math.round(minutes*0.4),
    title: `${milestone.label}: Move "${project.title}" Forward`,
    goal: `Contribute real progress on the ${milestone.label} stage of your active project.`,
    scenario: `Your active project is "${project.title}" (${project.typeLabel}). You're currently on the ${milestone.label} milestone. Use this session to push it forward — not to perfect it, just to move it.`,
    deliverable: `Visible progress on the ${milestone.label} milestone of "${project.title}".`,
    constraints: [`Stay focused on the ${milestone.label} milestone only`, `Work within your chosen time: ${bucket.label}`],
    direction: milestoneDirectionFor(milestone.label),
    process: scaleProcessForMinutes(minutes),
    references: project.references, approaches: [], focus: [milestone.label],
    extraChallenge: null,
    reflection: `What's the one thing about "${milestone.label}" you want to remember for next time?`,
    minDesc: `A shorter push on ${milestone.label} — one small, concrete step.`,
    projectId: project.id, milestoneId: milestone.id
  };
}

/* Backfills any project object to the current schema. Needed because a
   project saved by an earlier version of this app (before milestones/
   journal/deliverables existed) will crash renderProjects() — this is what
   was actually breaking the whole Projects section. Preserves whatever
   progress can be preserved (e.g. old checkbox-style tasksDone becomes
   milestone percent) instead of discarding the project. */
function sanitizeProject(p){
  const t = PROJ_BY_ID[p.templateId];
  const out = Object.assign({}, p);
  out.id = out.id || ("proj_legacy_"+Date.now()+"_"+Math.floor(Math.random()*999));
  out.title = out.title || (t ? t.title : "Untitled project");
  out.typeLabel = out.typeLabel || (t ? t.typeLabel : "");
  out.client = out.client || out.title;
  out.context = out.context || (t ? t.context : "");
  out.overview = out.overview || (t ? t.overviewFn(out.client) : "");
  out.goal = out.goal || (t ? t.goal : "");
  out.audience = out.audience || (t ? t.audience : "");
  out.direction = out.direction || (t ? t.direction : "");
  out.deliverables = Array.isArray(out.deliverables) ? out.deliverables : (t ? t.deliverables.slice() : []);
  out.constraints = Array.isArray(out.constraints) ? out.constraints : (t ? t.constraints.slice() : []);
  out.colorDirection = out.colorDirection || (t ? t.colorDirection : "");
  out.typographyDirection = out.typographyDirection || (t ? t.typographyDirection : "");
  out.approaches = Array.isArray(out.approaches) ? out.approaches : (t ? t.approaches.slice() : []);
  out.references = Array.isArray(out.references) ? out.references : (t ? t.references.slice() : []);
  out.process = Array.isArray(out.process) ? out.process : (t ? t.process : []);
  out.durationDays = out.durationDays || (t ? t.durationDays : "");
  out.estimatedHours = out.estimatedHours || (t ? t.estimatedHours : "");
  out.successCriteria = Array.isArray(out.successCriteria) ? out.successCriteria : (t ? t.successCriteria.slice() : []);
  out.extraChallenge = ("extraChallenge" in out) ? out.extraChallenge : (t ? t.extraChallenge : null);
  out.skills = Array.isArray(out.skills) && out.skills.length ? out.skills : (t ? t.skills.slice() : ["pd_composition"]);
  out.journal = Array.isArray(out.journal) ? out.journal : [];

  if(!Array.isArray(out.milestones) || out.milestones.length===0){
    const legacyDone = Array.isArray(p.tasksDone) ? p.tasksDone : [];
    if(t){
      // known template — map old checkbox progress onto the real milestone labels
      out.milestones = t.milestoneLabels.map((label,i)=>({
        id:"ms"+i, label, percent: legacyDone[i] ? 100 : 0, notes:"", files:[]
      }));
    } else if(Array.isArray(p.tasks) && p.tasks.length){
      out.milestones = p.tasks.map((label,i)=>({
        id:"ms"+i, label, percent: legacyDone[i] ? 100 : 0, notes:"", files:[]
      }));
    } else {
      // no template match and no label list to recover — collapse into one
      // milestone, but preserve the overall fraction of old progress rather
      // than silently rounding it up to 100%.
      const pct = legacyDone.length ? Math.round(100*legacyDone.filter(Boolean).length/legacyDone.length) : 0;
      out.milestones = [{id:"ms0", label:"Progress", percent: pct, notes:"", files:[]}];
    }
  } else {
    out.milestones = out.milestones.map((m,i)=>({
      id: m.id || ("ms"+i),
      label: m.label || ("Step "+(i+1)),
      percent: typeof m.percent==="number" ? m.percent : (m.done ? 100 : 0),
      notes: typeof m.notes==="string" ? m.notes : "",
      files: Array.isArray(m.files) ? m.files : []
    }));
  }
  out.startedDate = out.startedDate || todayStr();
  out.completedDate = out.completedDate || null;
  delete out.tasksDone; delete out.tasks;
  return out;
}

async function loadState(){
  try{
    const raw = await Store.get(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      S = Object.assign(defaultState(), parsed);
      const def = defaultState().skills;
      S.skills = Object.assign(def, S.skills || {});
      S.projects = Array.isArray(S.projects) ? S.projects.map(sanitizeProject) : [];
    } else {
      // one-time migration attempt from the old key/shape, best effort
      S = defaultState();
    }
  }catch(e){
    S = defaultState();
  }
}

async function saveState(){
  try{ await Store.set(STORAGE_KEY, JSON.stringify(S)); }
  catch(e){ /* best effort */ }
}

function logGenerated(mission){
  S.generatedLog.push({fingerprint:mission.fingerprint, varFingerprint:mission.varFingerprint, date:todayStr()});
  if(S.generatedLog.length > 200) S.generatedLog = S.generatedLog.slice(-200);
}

function recentVarFingerprints(n){
  return S.generatedLog.slice(-n).map(g=>g.varFingerprint);
}
function usedFingerprints(){
  return new Set(S.generatedLog.map(g=>g.fingerprint));
}

/* ===================== MISSION SELECTION ===================== */

function skillLevel(id){ return (S.skills[id] && S.skills[id].level) || 1; }

function daysSinceSkillPracticed(id){
  for(let i=S.history.length-1;i>=0;i--){
    const h = S.history[i];
    if(h.status==="completed" && h.skills && h.skills.includes(id)) return daysBetween(h.date, todayStr());
  }
  return 999;
}

function archetypeRecentPenalty(archetypeId, windowSize){
  const recent = S.generatedLog.slice(-(windowSize||12));
  let penalty = 0;
  for(let i=0;i<recent.length;i++){
    if(recent[i].varFingerprint.indexOf(archetypeId+":")===0){
      penalty += (recent.length - i);
    }
  }
  return penalty;
}

function archetypeScore(a, opts){
  opts = opts||{};
  let score = 0;
  const staleness = Math.max(...[a.primary,...a.secondary].map(daysSinceSkillPracticed));
  score += Math.min(staleness, 14);
  const avgLevel = [a.primary,...a.secondary].reduce((s,id)=>s+skillLevel(id),0)/(1+a.secondary.length);
  score -= Math.abs(a.diff - Math.round(avgLevel/2)) * 1.2;
  score -= archetypeRecentPenalty(a.id) * 1.4;
  if(opts.typeBias && a.taskType === opts.typeBias) score += 3;
  if(opts.family && a.family !== opts.family) score -= 999;
  if(opts.excludeFamilies && opts.excludeFamilies.includes(a.family)) score -= 999;
  if(opts.onlyIds && !opts.onlyIds.includes(a.id)) score -= 999;
  if(opts.excludeId && a.id === opts.excludeId) score -= 999;
  score += Math.random()*2.2;
  return score;
}

function pickArchetype(opts){
  let best=null, bestScore=-Infinity;
  ARCHETYPES.forEach(a=>{
    if(a.family==="project" && !(opts && opts.allowProject)) return;
    const sc = archetypeScore(a, opts);
    if(sc>bestScore){bestScore=sc;best=a;}
  });
  return best;
}

/* pick a variant index for an archetype, preferring one whose
   var-fingerprint hasn't been generated recently */
function pickVariant(archetype, opts){
  opts = opts||{};
  const recent = recentVarFingerprints(15);
  const indices = archetype.variants.map((_,i)=>i);
  const fresh = indices.filter(i=>{
    const fp = `${archetype.id}:${i}`;
    if(opts.excludeIndex===i) return false;
    return !recent.includes(fp);
  });
  const pool = fresh.length ? fresh : indices.filter(i=>opts.excludeIndex!==i);
  const finalPool = pool.length ? pool : indices;
  return finalPool[Math.floor(Math.random()*finalPool.length)];
}

function typeForDay(dateStr){
  const dow = new Date(dateStr+"T00:00:00").getDay();
  const cycle = ["study","recreate","create","study","practice","create","project"];
  return cycle[dow];
}

function missedStreakDays(){
  let count=0, d = addDays(todayStr(),-1);
  while(count<14){
    const hit = S.history.some(h=>h.status==="completed" && h.date===d);
    if(hit) break;
    if(daysBetween(S.startDate,d) < 0) break;
    count++;
    d = addDays(d,-1);
  }
  return count;
}

function hasActiveProject(){ return S.projects.some(p=>!p.completedDate); }

/* Called on every load. On a new day it resets the day's slate. If there's
   no active project it auto-generates the general mission exactly like
   before. If there IS an active project, it leaves S.dailyMission empty so
   renderToday() can show the "General / Work on Project" choice — the
   choice itself only happens once per day, right here. */
function ensureDailyMission(){
  const today = todayStr();
  if(S.dailyMissionDate === today) return; // already resolved (mission set OR choice pending) for today
  S.dailyMissionDate = today;
  S.dailyMission = null;
  S.extraMissions = [];
  S.harderChain = null;
  todayAskingTime = false;
  if(!hasActiveProject()){
    generateGeneralDailyMission();
  }
  saveState();
}

function generateGeneralDailyMission(){
  const today = todayStr();
  const recovery = missedStreakDays() >= 3;
  let archetype;
  if(recovery){
    archetype = pickArchetype({typeBias:"practice"});
  } else {
    const typeBias = typeForDay(today);
    archetype = pickArchetype({typeBias, allowProject: typeBias==="project"});
  }
  const variantIndex = pickVariant(archetype);
  const mission = buildConcreteMission(archetype.id, variantIndex, 1);
  S.dailyMission = {mission, mode:"normal", status:"active", recovery, origin:"general"};
  logGenerated(mission);
  saveState();
}

function chooseProjectDailyMission(project, timeKey){
  S.lastProjectTimeChoice = timeKey;
  const mission = buildProjectMission(project, timeKey);
  S.dailyMission = {mission, mode:"normal", status:"active", recovery:false, origin:"project", projectId:project.id, milestoneId:mission.milestoneId};
  saveState();
}

/* ===================== EXTRA MISSION GENERATION ===================== */

function generateExtra(kind){
  const daily = S.dailyMission.mission;
  const isProjectOrigin = typeof daily.archetypeId==="string" && daily.archetypeId.indexOf("project:")===0;
  const dailyArch = isProjectOrigin ? null : ARCH_BY_ID[daily.archetypeId];
  // "similar"/"harder" don't have a normal archetype to anchor to when
  // today's mission came from a Project — fall back to "random" instead.
  if(isProjectOrigin && (kind==="similar" || kind==="harder")) kind = "random";
  let mission;

  if(kind === "harder"){
    let chain = S.harderChain;
    if(!chain) chain = {archetypeId: daily.archetypeId, variantIndex: daily.variantIndex, level: daily.level};
    let nextLevel = chain.level + 1;
    let archetypeId = chain.archetypeId, variantIndex = chain.variantIndex;
    const arch = ARCH_BY_ID[archetypeId];
    const ladderLen = arch.ladder ? Object.keys(LADDERS[arch.ladder]).length + 1 : 3;
    if(nextLevel > ladderLen){
      const candidates = ARCHETYPES.filter(a=>a.family===arch.family && a.id!==archetypeId && a.ladder);
      const next = candidates[Math.floor(Math.random()*candidates.length)] || arch;
      archetypeId = next.id;
      variantIndex = pickVariant(next);
      nextLevel = 3;
    }
    mission = buildConcreteMission(archetypeId, variantIndex, nextLevel);
    S.harderChain = {archetypeId, variantIndex, level: nextLevel};
  } else if(kind.indexOf("skill:")===0){
    S.harderChain = null;
    const tag = kind.slice(6);
    const focus = SKILL_FOCUS_TAGS.find(f=>f.tag===tag);
    const arch = focus ? ARCH_BY_ID[focus.archetypeId] : pickArchetype({});
    mission = buildConcreteMission(arch.id, pickVariant(arch), 1);
  } else {
    S.harderChain = null;
    if(kind === "similar"){
      const variantIndex = pickVariant(dailyArch, {excludeIndex: daily.variantIndex});
      mission = buildConcreteMission(daily.archetypeId, variantIndex, 1);
    } else if(kind === "different"){
      const allFamilies = ["gd","il","pd","color","vector","identity","music","street"];
      const otherFamilies = allFamilies.filter(f=>f!==daily.cat);
      const family = otherFamilies[Math.floor(Math.random()*otherFamilies.length)];
      const arch = pickArchetype({family, typeBias:"create"}) || pickArchetype({});
      mission = buildConcreteMission(arch.id, pickVariant(arch), 1);
    } else if(kind === "creative"){
      const usedIds = usedFingerprints();
      let candidates = CREATIVE_ARCH_IDS.filter(id=>{
        return ARCH_BY_ID[id].variants.some((_,i)=>!usedIds.has(`${id}:${i}:1`));
      });
      if(!candidates.length) candidates = CREATIVE_ARCH_IDS;
      const archId = candidates[Math.floor(Math.random()*candidates.length)];
      const arch = ARCH_BY_ID[archId];
      mission = buildConcreteMission(archId, pickVariant(arch), 1);
    } else { // random
      const arch = pickArchetype({});
      mission = buildConcreteMission(arch.id, pickVariant(arch), 1);
    }
  }

  logGenerated(mission);
  const inst = {uid:(kind==="harder"?"h":"x")+Date.now()+Math.floor(Math.random()*999), kind, mission};
  S.extraMissions.push(inst);
  saveState();
  return inst;
}

function generateBored(){
  const usedIds = usedFingerprints();
  let candidates = CREATIVE_ARCH_IDS.filter(id=>{
    return ARCH_BY_ID[id].variants.some((_,i)=>!usedIds.has(`${id}:${i}:1`));
  });
  if(!candidates.length) candidates = CREATIVE_ARCH_IDS;
  const archId = candidates[Math.floor(Math.random()*candidates.length)];
  const arch = ARCH_BY_ID[archId];
  const mission = buildConcreteMission(archId, pickVariant(arch), 1);
  logGenerated(mission);
  const inst = {uid:"b"+Date.now(), kind:"bored", mission};
  S.extraMissions.push(inst);
  S.harderChain = null;
  saveState();
  return inst;
}

/* ===================== STATS ===================== */

function completedDatesSet(){
  const s = new Set();
  S.history.forEach(h=>{ if(h.status==="completed") s.add(h.date); });
  return s;
}

function computeStreaks(){
  const dates = completedDatesSet();
  let current=0, d = todayStr();
  if(!dates.has(d)) d = addDays(d,-1);
  while(dates.has(d)){ current++; d = addDays(d,-1); }
  const sorted = Array.from(dates).sort();
  let longest=0, run=0, prev=null;
  sorted.forEach(ds=>{
    if(prev && daysBetween(prev,ds)===1) run++; else run=1;
    longest = Math.max(longest,run);
    prev = ds;
  });
  longest = Math.max(longest,current);
  return {current, longest};
}

function computeMonthStats(){
  const now = new Date();
  const y=now.getFullYear(), mo=now.getMonth();
  const dim = new Date(y,mo+1,0).getDate();
  const dates = completedDatesSet();
  let completedDays=0, minutes=0, missionsCompleted=0;
  const cells=[];
  for(let day=1;day<=dim;day++){
    const ds = `${y}-${String(mo+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const hit = dates.has(ds);
    if(ds<=todayStr()){ if(hit) completedDays++; cells.push({ds,hit,future:false}); }
    else cells.push({ds,hit:false,future:true});
  }
  S.history.forEach(h=>{
    if(h.status!=="completed") return;
    if(h.date.slice(0,7) === `${y}-${String(mo+1).padStart(2,"0")}`){
      minutes += h.minutes||0; missionsCompleted++;
    }
  });
  const elapsed = Math.min(now.getDate(), dim);
  const consistency = elapsed>0 ? Math.round((completedDays/elapsed)*100) : 0;
  return {completedDays, elapsed, dim, minutes, missionsCompleted, consistency, cells};
}

function totalStats(){
  let minutes=0, missions=0;
  S.history.forEach(h=>{ if(h.status==="completed"){ minutes+=h.minutes||0; missions++; } });
  const projectsCompleted = S.projects.filter(p=>p.completedDate).length;
  return {minutes, missions, projectsCompleted};
}

function xpForCompletion(mode){ return mode==="minimum" ? 6 : 12; }

function applySkillGains(skillIds, mode){
  const levelUps = [];
  skillIds.forEach(id=>{
    const sk = S.skills[id];
    if(!sk) return;
    sk.xp += xpForCompletion(mode);
    const newLevel = Math.min(10, Math.floor(sk.xp/40)+1);
    if(newLevel > sk.level){ sk.level = newLevel; levelUps.push(sk.name); }
  });
  return levelUps;
}

/* ===================== ACTIONS ===================== */

let historyIdCounter = 1;
function nextHistoryId(){ return "h"+(Date.now())+"_"+(historyIdCounter++); }

function completeMission({mission, mode, source, perceived, notes, thumb, extraUid, projectId, milestoneId}){
  const minutes = mode==="minimum" ? mission.minTime : mission.time;
  const entry = {
    id: nextHistoryId(),
    date: todayStr(), title:mission.title, cat:mission.cat, type:mission.taskType,
    skills:mission.skills, status:"completed", mode, source: source||"daily",
    minutes, perceived: perceived||null, notes: notes||"", thumb: thumb||null,
    /* full snapshot of the mission exactly as it was generated/assigned —
       History always shows this, never a re-generated version, even if the
       mission generator changes later. */
    mission: mission,
    projectId: projectId||null, milestoneId: milestoneId||null
  };
  S.history.push(entry);
  S.lastCompletionDate = todayStr();
  const levelUps = applySkillGains(mission.skills, mode);
  if(source==="daily" || source==="project"){ S.dailyMission.status = "completed"; }
  if(source==="extra" && extraUid){ S.extraMissions = S.extraMissions.filter(x=>x.uid!==extraUid); }
  if(source==="project" && projectId){ applyProjectProgress(projectId, milestoneId); }
  saveState();
  return levelUps;
}

function abandonMission({mission, reason, source}){
  S.history.push({
    id: nextHistoryId(),
    date: todayStr(), title:mission.title, cat:mission.cat, type:mission.taskType,
    skills:mission.skills, status:"abandoned", reason, source: source||"daily", minutes:0,
    mission: mission
  });
  if(source==="daily" || source==="project"){ S.dailyMission.status = "abandoned"; }
  saveState();
}

function startProject(templateId){
  if(S.projects.some(p=>p.templateId===templateId && !p.completedDate)) return null;
  const project = buildProjectBrief(templateId);
  S.projects.push(project);
  // Today's slate is normally only decided once per day. Without this, a
  // project started after today's general mission was already auto-generated
  // would have no way to offer a project task until tomorrow's reset.
  if(S.dailyMission && S.dailyMission.origin==="general" && S.dailyMission.status==="active"){
    S.dailyMission = null;
  }
  saveState();
  return project;
}

function diffDots(n){
  let s='<span class="diff-dots">';
  for(let i=1;i<=5;i++) s += `<span class="${i<=n?"on":""}"></span>`;

}

function showToast(msg){
  const existing = document.querySelector(".toast");
  if(existing) existing.remove();
  const t = el(`<div class="toast">${msg}</div>`);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.remove(), 3200);
}

function renderHistory(){

    html += `<div class="card" style="padding:6px 22px;">`;

      html += `<div class="hist-item" data-history-id="${h.id}">

/* ===================== MAIN RENDER ===================== */

function resetAllProgress(){
  const keepTheme = S ? S.theme : "light";
  S = defaultState();
  S.theme = keepTheme;
  todayAskingTime = false;
  modalState = null;
  saveState();
}

function render(){
  document.documentElement.setAttribute("data-theme", S.theme);
  try{
    let body = "";
    if(S.view==="today") body = renderToday();
    else if(S.view==="skills") body = renderSkills();
    else if(S.view==="progress") body = renderProgress();
    else if(S.view==="projects") body = renderProjects();
    else if(S.view==="history") body = renderHistory();

    document.getElementById("app").innerHTML = renderStorageBanner() + renderTopbar() + body + renderModal();
    bindEvents();
  }catch(err){
    /* Last-resort safety net: a render error (e.g. corrupted data from an
       older version) should never leave the person staring at a blank
       screen with no way out. Offer a reset instead of failing silently. */
    document.getElementById("app").innerHTML = `
      <div class="wrap" style="padding-top:60px;">
        <div class="card" style="padding:24px;">
          <h2 style="font-size:19px;margin-bottom:10px;">Something went wrong loading this screen</h2>
          <p class="muted" style="font-size:13.5px;margin-bottom:16px;">This can happen if saved data got into a bad state. You can try again, or reset all progress and start fresh.</p>
          <div class="row">
            <button class="btn btn-ghost" id="error-retry">Try again</button>
            <button class="btn btn-primary" id="error-reset">Reset all progress</button>
          </div>
        </div>
      </div>`;
    const retryBtn = document.getElementById("error-retry");
    if(retryBtn) retryBtn.addEventListener("click",()=>{ S.view="today"; render(); });
    const resetBtn = document.getElementById("error-reset");
    if(resetBtn) resetBtn.addEventListener("click",()=>{
      modalState = {kind:"reset"};
      render();
    });
  }
}

/* shared helper: read an <input type=file>, resize to a small thumbnail
   dataURL, and hand it to the given callback. Reused by mission reflection,
   milestone uploads, and journal entries. */
function readImageThumb(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL("image/jpeg",0.6));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

    b.classList.add("selected");
  }));
  app.querySelectorAll("[data-journal-file]").forEach(inp=>inp.addEventListener("change",(e)=>{
    const pid = inp.dataset.journalFile;
    const file = e.target.files[0];
    if(!file) return;
    readImageThumb(file, 220, (dataUrl)=>{ pendingJournalThumb[pid] = dataUrl; showToast("Image attached"); });
  }));
  app.querySelectorAll("[data-journal-add]").forEach(b=>b.addEventListener("click",()=>{
    const pid = b.dataset.journalAdd;
    const notesEl = document.querySelector(`[data-journal-notes="${pid}"]`);
    const category = pendingJournalCat[pid] || JOURNAL_CATEGORIES[0];
    const notes = notesEl ? notesEl.value.trim() : "";
    if(!notes && !pendingJournalThumb[pid]){ showToast("Add a note or an image first"); return; }
    addJournalEntry(pid, {category, notes, thumb: pendingJournalThumb[pid]||null});
    delete pendingJournalThumb[pid];
    render();
    showToast("Journal entry added");
  }));

  const overlay = document.getElementById("modal-overlay");
  const closeX = document.getElementById("modal-close");
  const closeBtn2 = document.getElementById("modal-close-2");
  [closeX, closeBtn2].forEach(b=>{ if(b) b.addEventListener("click",()=>{ modalState=null; render(); }); });
  if(overlay) overlay.addEventListener("click",(e)=>{ if(e.target===overlay){ modalState=null; render(); } });

  const modalToMin = document.getElementById("modal-to-min");
  if(modalToMin) modalToMin.addEventListener("click",()=>{
    S.dailyMission.mode="minimum"; saveState(); modalState=null; render();
  });

  if(modalState && modalState.kind==="reflect"){
    app.querySelectorAll("[data-diff]").forEach(b=>b.addEventListener("click",()=>{
      pendingReflectDiff = b.dataset.diff;
      app.querySelectorAll("[data-diff]").forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
    }));
    const fileInput = document.getElementById("reflect-file");
    if(fileInput) fileInput.addEventListener("change",(e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 200;
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement("canvas");
          canvas.width = img.width*scale; canvas.height = img.height*scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img,0,0,canvas.width,canvas.height);
          pendingThumb = canvas.toDataURL("image/jpeg",0.6);
          showToast("Artwork attached");
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });
    const skip = document.getElementById("reflect-skip");
    if(skip) skip.addEventListener("click",()=>{ finishReflect(true); });
    const save = document.getElementById("reflect-save");
    if(save) save.addEventListener("click",()=>{ finishReflect(false); });
  }

  if(modalState && modalState.kind==="abandon"){
    app.querySelectorAll("[data-reason]").forEach(b=>b.addEventListener("click",()=>{
      pendingAbandonReason = b.dataset.reason;
      app.querySelectorAll("[data-reason]").forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
      document.getElementById("abandon-confirm").disabled = false;
    }));
    const confirmBtn = document.getElementById("abandon-confirm");
    if(confirmBtn) confirmBtn.addEventListener("click",()=>{
      abandonMission({mission:modalState.mission, reason:pendingAbandonReason, source:modalState.source});
      modalState = null;
      render();
      showToast("No worries. See you tomorrow.");
    });
  }

  if(modalState && modalState.kind==="milestone"){
    app.querySelectorAll("[data-milestone-pct]").forEach(b=>b.addEventListener("click",()=>{
      pendingMilestonePct = parseInt(b.dataset.milestonePct);
      app.querySelectorAll("[data-milestone-pct]").forEach(x=>x.classList.remove("selected"));
      b.classList.add("selected");
    }));
    const mFile = document.getElementById("milestone-file");
    if(mFile) mFile.addEventListener("change",(e)=>{
      const file = e.target.files[0];
      if(!file) return;
      readImageThumb(file, 220, (dataUrl)=>{ pendingMilestoneThumb = dataUrl; showToast("Image attached"); });
    });
    const mSave = document.getElementById("milestone-save");
    if(mSave) mSave.addEventListener("click",()=>{
      const notesEl = document.getElementById("milestone-notes");
      updateMilestone(modalState.projectId, modalState.milestoneId, {
        percent: pendingMilestonePct,
        notes: notesEl ? notesEl.value.trim() : "",
        thumb: pendingMilestoneThumb
      });
      modalState = null;
      render();
      showToast("Milestone updated");
    });
  }
}

function finishReflect(skip){
  const notesEl = document.getElementById("reflect-notes");
  const notes = skip ? "" : (notesEl ? notesEl.value.trim() : "");
  const perceived = skip ? null : pendingReflectDiff;
  const levelUps = completeMission({
    mission: modalState.mission,
    mode: modalState.mode,
    source: modalState.source,
    extraUid: modalState.extraUid,
    projectId: modalState.projectId,
    milestoneId: modalState.milestoneId,
    perceived, notes,
    thumb: skip ? null : pendingThumb
  });
  modalState = null;
  render();
  if(levelUps.length){
    showToast(`Level up — ${levelUps[0]}${levelUps.length>1?` +${levelUps.length-1} more`:""} ✦`);
  } else {
    showToast("Mission complete. That's the whole job today.");
  }
}

/* ===================== BOOT ===================== */

/* Detects browsing contexts where localStorage silently doesn't persist —
   Safari Private Browsing, and (the common iPad case) opening this file
   from within Mail/Files' built-in preview instead of a real Safari tab.
   Store already fails safely in these cases; this just tells the person
   why their progress might vanish, instead of leaving them to find out
   the hard way after a day of missions. */
function checkStorageOk(){
  try{
    const k = "__storage_test__";
    window.localStorage.setItem(k, "1");
    const ok = window.localStorage.getItem(k) === "1";
    window.localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}
let storageOk = true;
let storageWarningDismissed = false;

function renderStorageBanner(){
  if(storageOk || storageWarningDismissed) return "";
  return `
  <div class="storage-banner">
    <span>Your progress may not be saved here — this looks like a preview window (e.g. Mail or Files), not a full Safari tab, or Private Browsing. Open this file directly in Safari, or use Share → Add to Home Screen, to keep your streak.</span>
    <button id="dismiss-storage-warning">✕</button>
  </div>`;
}

(async function boot(){
  storageOk = checkStorageOk();
  await loadState();
  S.lastOpenDate = todayStr();
  ensureDailyMission();
  await saveState();
  render();
})();

})();




</script>
